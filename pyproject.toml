[project]
name = "devlens"
version = "0.0.1"
description = "Static engineering analysis for code repositories: structure, technologies, architecture, duplication, dependencies and a technical report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "João Alves" }]
requires-python = ">=3.11"
keywords = ["static-analysis", "architecture", "code-quality", "dependency-graph", "software-engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.urls]
Repository = "https://github.com/JoaoAlves20/DevLens"
Issues = "https://github.com/JoaoAlves20/DevLens/issues"

[project.scripts]
devlens = "devlens.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devlens"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "N",        # naming
]

[tool.ruff.lint.flake8-bugbear]
# Typer uses function-call defaults (typer.Option) by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=devlens --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
exclude_also = ["if __name__ == .__main__.:"]
